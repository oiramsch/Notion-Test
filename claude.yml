name: Claude Notion Smoke Test

on:
  issues:
    types: [opened]

jobs:
  claude:
    if: contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Write MCP config
        if: env.NOTION_TOKEN != ''
        run: |
          cat > /tmp/mcp-notion.json << EOF
          {
            "mcpServers": {
              "notion": {
                "type": "url",
                "url": "https://mcp.notion.com/mcp",
                "headers": {
                  "Authorization": "Bearer $NOTION_TOKEN"
                }
              }
            }
          }
          EOF

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          trigger_phrase: "@claude"
          agent_instructions: |
            Test Instructions:
            1. Use ONLY the mcp__notion__notion-fetch tool to fetch Notion page ID: 31e765e5dc96801aac98c65d298dab89
            2. If the fetch succeeds and you can access the page title, respond with: TITLE_OK
            3. If the Notion MCP is unavailable or the fetch fails, respond with: NOTION_MCP_UNAVAILABLE
            4. Provide ONLY one of these two responses as your final answer.
          claude_args: >-
            ${{ env.NOTION_TOKEN != '' && '--mcp-config /tmp/mcp-notion.json --allowed-tools "mcp__notion__notion-fetch,mcp__github_comment__update_claude_comment"' || '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
